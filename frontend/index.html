<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Viewport ────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ─────────────────────────────────────────────────── -->
    <title>WorldInsights — Ideas Worth Reading</title>
    <meta name="description" content="WorldInsights is a modern blog platform exploring technology, design, business, lifestyle, and science. Discover articles written by people who care about their craft." />
    <meta name="keywords" content="WorldInsights, blog, technology, design, business, lifestyle, science, articles, insights" />
    <meta name="author" content="WorldInsights" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://worldinsights.app/" />

    <!-- ── Open Graph (Facebook / LinkedIn) ────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorldInsights" />
    <meta property="og:title" content="WorldInsights — Ideas Worth Reading" />
    <meta property="og:description" content="Explore articles on technology, design, business, lifestyle, and science — written by people who care about their craft." />
    <meta property="og:image" content="https://worldinsights.app/og-image.png" />
    <meta property="og:url" content="https://worldinsights.app/" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@worldinsights" />
    <meta name="twitter:title" content="WorldInsights — Ideas Worth Reading" />
    <meta name="twitter:description" content="Explore articles on technology, design, business, lifestyle, and science — written by people who care about their craft." />
    <meta name="twitter:image" content="https://worldinsights.app/og-image.png" />

    <!-- ── Theme color (browser chrome on mobile) ──────────────────────── -->
    <meta name="theme-color" content="#2463F1" />

    <!-- ── Fonts ────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
